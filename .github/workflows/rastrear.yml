name: Rastrear Calendario

on:
  schedule:
    # Desde el 15 de noviembre, 00:00 hora de Colombia, hasta el 15 de diciembre.
    # GitHub a veces retrasa las tareas programadas.
    - cron: "*/15 5-23 15 11 *"
    - cron: "*/15 * 16-30 11 *"
    - cron: "*/15 * 1-15 12 *"
    - cron: "*/15 0-4 16 12 *"
  workflow_dispatch:
    inputs:
      prueba:
        description: Enviar mensaje de prueba
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rastrear-calendario
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar stock y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event_name }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
        run: python rastrear.py

      - name: Publicar estado en la página
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Actualizar disponibilidad de Calendario"
            git push
          fi
