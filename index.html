<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastreador Calendario · Trendy</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <header class="cabecera">
      <p class="marca">Trendy Shop</p>
      <h1>Calendario</h1>
      <p class="resumen" id="resumen">Buscando el estado guardado…</p>
    </header>

    <section class="horario" aria-live="polite">
      <div>
        <p class="etiqueta">Última búsqueda</p>
        <p class="momento" id="ultima">…</p>
      </div>
      <div>
        <p class="etiqueta">Siguiente búsqueda</p>
        <p class="momento" id="siguiente">…</p>
      </div>
    </section>
    <p class="nota">La siguiente hora es la programada. GitHub puede demorarla unos minutos.</p>

    <p class="acciones">
      <a class="boton" href="https://github.com/auxiliarprogramer/rastreador/actions/workflows/rastrear.yml">Probar aviso</a>
    </p>

    <section id="lista" class="lista" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
